# see https://github.com/sigoden/aichat/blob/main/config.example.yaml

clients:
- type: openai-compatible
  name: llama.cpp
  api_base: http://localhost:18080/v1
  models:
  - name: local
    # Expert DevOps persona integrated here
    default_system_prompt: >
      You are a Senior DevOps Architect (Expert in Linux, Git, Bash, k8s, Terraform).
      Provide code-first, expert-level solutions. No conversational filler.
      Use modern CLI standards (e.g., 'git switch', 'ip').
