# ===========================================================================
# mise configuration
# ===========================================================================
#
# Lives at ~/.config/mise/config.toml — mise's global configuration. Global is
# what makes `mise` work from any directory, and it is the only scope where
# `[dotfiles]` tracking is honored.
#
#   ~/.config/mise/mise.toml      this file — the machine
#   ~/.config/mise/tasks/                file tasks that stay imperative
#
# Dotfiles use whole-file `copy` entries, exactly as in the mise docs
# ("Start with one managed file"): each `source` is relative to this config
# file's directory, so source = ".zshrc" means ~/.config/mise/.zshrc.
# `mise dot apply` copies repo -> live; `mise dot add --changed` captures
# live edits back into the repo. History is git.
#
# --------------------------------------------------------------------------
# Settings
# --------------------------------------------------------------------------
[settings]
# Read .nvmrc / .node-version (node) and the `packageManager` field in
# package.json (pnpm), so each project pins its own runtime. This replaces the
# old `fnm env --use-on-cd --version-file-strategy=recursive` behaviour.
idiomatic_version_file_enable_tools = ["node", "pnpm"]

# Keep mise quiet about version bumps; check with `mise outdated` deliberately.
# (Remove if you prefer the reminders.)

# --------------------------------------------------------------------------
# Development tools
# --------------------------------------------------------------------------
[tools]
node = "22"
"npm:pnpm" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"

# Installed from the upstream GitHub release rather than the distro package.
pandoc = "latest"

# --------------------------------------------------------------------------
# Environment
# --------------------------------------------------------------------------
# mise prepends its own shim directory to PATH automatically. `_.path` appends
# directories for things installed outside mise.
[env]
EDITOR = "nvim"
_.path = ["~/.local/bin", "~/go/bin", "~/.cargo/bin"]

# --------------------------------------------------------------------------
# Login shell
# --------------------------------------------------------------------------
# mise appends the path to /etc/shells if it is missing, then runs `chsh -s`.
# Install the shell first; mise does not.
[bootstrap.user]
login_shell = "/usr/bin/zsh"

# ===========================================================================
# Host packages
# ===========================================================================
# "latest" accepts an already-installed version: `apply` installs what is
# missing and does not upgrade on every run.
#
# Rolling-release caveat: on Arch the distribution ships only the newest build of
# each package, so pinned `pacman:` / `aur:` entries are skipped with a warning.
# Use "latest" and upgrade the whole system with the distro's own command rather
# than `mise bootstrap packages upgrade`, which is a partial upgrade.
[bootstrap.packages]
# --- fonts ---------------------------------------------------------------
"pacman:ttf-jetbrains-mono" = "latest"
"pacman:ttf-jetbrains-mono-nerd" = "latest"

# --- shell and terminal ----------------------------------------------------
"pacman:zsh" = "latest"
"pacman:alacritty" = "latest"

# --- command line tools ----------------------------------------------------
"pacman:atuin" = "latest"
"pacman:tig" = "latest"
"pacman:yazi" = "latest"
"pacman:zoxide" = "latest"
"pacman:7zip" = "latest"
"pacman:ncdu" = "latest"
"pacman:gum" = "latest"
"pacman:aichat" = "latest"
"pacman:ueberzugpp" = "latest"   # image preview for yazi / vifm
"pacman:nwg-displays" = "latest" # Wayland display management
"pacman:wl-clipboard" = "latest" # wl-copy / wl-paste

# --- prompt --------------------------------------------------------------
"pacman:starship" = "latest"

# --- removable media -----------------------------------------------------
"pacman:udiskie" = "latest"

# --- browsers ------------------------------------------------------------
"pacman:firefox" = "latest"
"aur:google-chrome" = "latest"
"aur:brave-bin" = "latest"

# --- application launcher and clipboard manager ---------------------------
"pacman:rofi" = "latest"
"pacman:cliphist" = "latest"

# --- audio ---------------------------------------------------------------
"pacman:pipewire" = "latest"
"pacman:pipewire-pulse" = "latest"
"pacman:pipewire-alsa" = "latest"
"pacman:wireplumber" = "latest"
"pacman:pavucontrol" = "latest"

# --------------------------------------------------------------------------
# Supplementary groups
# --------------------------------------------------------------------------
# Membership is declared from the user side. `groups` only ADDS missing
# memberships by default; `exclusive_groups = true` would remove every
# membership not listed, so do not set it here.
#
# Enable only after `mise bootstrap accounts apply --dry-run` reads clean —
# this makes the login account declaratively managed through shadow-utils.
#
# [bootstrap.users.youruser]
# group  = "youruser"     # primary group, required for present users
# groups = ["audio"]

# ===========================================================================
# Git checkouts
# ===========================================================================
# mise clones what is missing and only updates a checkout when the worktree is
# clean and the origin URL matches. `mise bootstrap repos update` fast-forwards.
[bootstrap.repos]
# oh-my-zsh itself is declared here so the whole tree is owned by `repos`.
# Do NOT run the upstream installer — it refuses a non-empty $ZSH, and the
# plugin checkouts below create that directory before any task can run.
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh" }
"~/.oh-my-zsh/custom/plugins/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab" }
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }
"~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
"~/.oh-my-zsh/custom/plugins/pnpm" = { url = "https://github.com/ntnyq/omz-plugin-pnpm.git" }

# Workspace session manager for Hyprland.
"~/.local/share/omarchy-session/src" = { url = "https://github.com/dataforxyz/omarchy-session" }

# ===========================================================================
# Dotfiles
# ===========================================================================
# Whole-file `copy` entries: `source` is relative to this config file's
# directory (~/.config/mise). Apply copies repo -> live and overwrites the
# targets without --force. Directory copies are additive: machine-local
# files the repo doesn't have (~/.config/git/config.local, vifminfo.json,
# ...) are left alone. `exclude` filters the source tree.
[dotfiles]

# --- shell ---------------------------------------------------------------
"~/.zshrc" = { source = ".zshrc", mode = "copy" }
"~/.bashrc" = { source = ".bashrc", mode = "copy" }
"~/.profile" = { source = ".profile", mode = "copy" }
"~/.config/zsh" = { source = ".config/zsh", mode = "copy" }

# --- terminal ------------------------------------------------------------
"~/.wezterm.lua" = { source = ".wezterm.lua", mode = "copy" }
"~/.config/alacritty" = { source = ".config/alacritty", mode = "copy" }
"~/.config/ghostty" = { source = ".config/ghostty", mode = "copy" }

# --- git -----------------------------------------------------------------
"~/.config/git" = { source = ".config/git", mode = "copy" }

# --- prompt --------------------------------------------------------------
"~/.config/starship.toml" = { source = ".config/starship.toml", mode = "copy" }

# --- editors and file managers -------------------------------------------
"~/.config/nvim" = { source = ".config/nvim", mode = "copy" }
"~/.tigrc" = { source = ".tigrc", mode = "copy" }
"~/.config/vifm" = { source = ".config/vifm", mode = "copy" }
"~/.config/yazi" = { source = ".config/yazi", mode = "copy" }

# --- window managers -----------------------------------------------------
# Both hypr sets ship everywhere and Hyprland's own version precedence
# picks the right one per machine: < 0.55 (host, 0.54.3) reads the
# hyprlang .conf set and ignores .lua; Omarchy 4 (0.55+) prefers
# hyprland.lua over hyprland.conf. No profile/env needed. Machine-local
# files the repo doesn't have (monitors.*) are left alone by the copy.
"~/.config/hypr" = { source = ".config/hypr", mode = "copy" }
"~/.config/i3" = { source = ".config/i3", mode = "copy" }

# --- launcher theme ------------------------------------------------------
"~/.config/rofi" = { source = ".config/rofi", mode = "copy" }

# ===========================================================================
# systemd user units
# ===========================================================================
# `apply` rewrites changed units, runs `systemctl --user daemon-reload`,
# enables units per `wanted_by`, and restarts them when `start = true`.
#
# mise writes these as dev.mise.<name>.service and owns only files carrying
# that prefix.
#
# Supported keys: description, after, wants, requires, before*, binds_to*,
# part_of*, conflicts*, exec_start_pre*, exec_start, exec_start_post*,
# exec_stop, type, remain_after_exit, timeout_start_sec, timeout_stop_sec,
# no_new_privileges, private_tmp, environment, environment_file, nice, umask,
# working_directory, restart, restart_sec, standard_output, standard_error,
# wanted_by, start.  (* not implemented in every release — check
# `mise bootstrap linux systemd-units apply --dry-run` before relying on one.)
[bootstrap.linux.systemd.units.udiskie]
description = "udiskie mount daemon"
type = "simple"
exec_start = "/usr/bin/udiskie --no-notify --smart-tray"
after = ["graphical-session.target"]
wanted_by = ["graphical-session.target"]

[bootstrap.linux.systemd.units.omarchy-session-autosave]
description = "omarchy-session workspace autosave loop"
type = "simple"
exec_start = "~/.local/bin/omarchy-session autosave-loop"
after = ["graphical-session.target"]
restart = "on-failure"
restart_sec = "15"
nice = 10
wanted_by = ["graphical-session.target"]

# ===========================================================================
# Tasks
# ===========================================================================
# File tasks in tasks/ (that is, ~/.config/mise/tasks/) are discovered by
# filename. `mise tasks ls` lists
# them. `mise bootstrap` runs a task named `bootstrap` as its final step, and
# may run it again on later bootstraps, so everything it calls must be safe to
# repeat.
[tasks.bootstrap]
description = "final bootstrap step: session manager"
# outputs = { auto = true } keys freshness on a hash of this task definition,
# so the task re-runs when it is edited and is skipped otherwise.
outputs = { auto = true }
run = "mise run omarchy-session"
# zsh-setup is gone: oh-my-zsh is now a [bootstrap.repos] entry, so the repos
# phase installs and updates it. The upstream installer cannot run against a
# non-empty $ZSH and always failed here.
