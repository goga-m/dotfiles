# ===========================================================================
# mise.omarchy4.toml — overlay for Omarchy 4 "quattro"
# ===========================================================================
# Loaded IN ADDITION to mise.toml when the `omarchy4` profile is active:
#
#   per-machine (preferred):
#     echo 'env = ["omarchy4"]' > ~/.config/mise/miserc.local.toml
#   or one-off:
#     mise -E omarchy4 bootstrap
#
# Why a profile and not a conditional: chezmoi picked the config set with
# `{{ if stat "/usr/share/omarchy/default/hypr/omarchy.lua" }}`. mise's
# [dotfiles] `source` values are NOT templated (verified on 2026.9.9 — the
# {{ }} is taken literally), and `variants` select on os/arch/profile only —
# there is no "file exists" selector. Both the host and the quattro VM are
# linux-x64, so platform auto-detection cannot tell them apart either.
#
# One line of per-machine setup replaces the stat() call.
#
# Omarchy 4 is package-backed (/usr/share/omarchy) and configured in Lua;
# Hyprland 0.55+ prefers hyprland.lua over hyprland.conf whenever both exist.
# --------------------------------------------------------------------------

[dotfiles]
"~/.config/hypr/hyprland.lua" = { source = "dotfiles/.config/hypr/hyprland.lua" }
"~/.config/hypr/bindings.lua" = { source = "dotfiles/.config/hypr/bindings.lua" }
"~/.config/hypr/input.lua" = { source = "dotfiles/.config/hypr/input.lua" }
"~/.config/hypr/autostart.lua" = { source = "dotfiles/.config/hypr/autostart.lua" }

# What about the Omarchy 3 .conf files? They stay on disk on a quattro box.
# The docs describe `mode = "absent"` for exactly this, but mise 2026.9.9 does
# not implement it yet ("unknown mode 'absent', ignoring entry" — verified).
# This is acceptable: Hyprland 0.55+ ignores hyprland.conf entirely when
# hyprland.lua is present, so the .conf set is inert — the same practical
# outcome as chezmoi's `.chezmoiignore`, which also never deleted them.
# Once you are on a mise that supports it, add for each file:
#   "~/.config/hypr/hyprland.conf" = { mode = "absent" }
