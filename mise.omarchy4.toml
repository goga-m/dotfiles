# ===========================================================================
# Profile overlay: Omarchy 4 "quattro"
# ===========================================================================
# Omarchy 4 is package-backed (/usr/share/omarchy) and configured in Lua,
# where Omarchy 3 uses hyprlang and ~/.local/share/omarchy. Hyprland 0.55+
# prefers hyprland.lua over hyprland.conf whenever both exist, so only one set
# should be captured per machine.
#
# Activate the profile per machine:
#
#   echo 'env = ["omarchy4"]' > ~/.config/mise/miserc.local.toml
#
# or for a single command:
#
#   mise -E omarchy4 bootstrap
#
# This file must be installed next to the main config as
# ~/.config/mise/config.omarchy4.toml for the profile to be found.
#
# Entries merge by target path, so this replaces the base entry for
# ~/.config/hypr entirely — the base exclusions are repeated here.
# --------------------------------------------------------------------------

[dotfiles]
"~/.config/hypr" = { mode = "track", exclude = [
  "monitors.conf",
  "monitors.lua",
  "*.conf",          # Omarchy 3 set: not used on quattro
] }
